name: Extract and Release

on:
  push:
    branches:
      - "data"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download OTA zip
        run: |
          curl -LJO https://github.com/muralivijay/crdroid_a13_OTA_spes/releases/download/v9.36/crDroidAndroid-13.0-20260510-spes-v9.36-Vanilla.zip
          echo "OTA_ZIP=$(ls *.zip)" >> $GITHUB_ENV

      - name: Extract payload
        run: |
          chmod +x .github/scripts/android-ota-extractor
          .github/scripts/android-ota-extractor "${{ env.OTA_ZIP }}"

      - name: Extract product.img
        run: |
          7z x product.img "-oproduct_extracted/"
          echo "--- app ---"
          ls product_extracted/app || echo "(empty)"
          echo "--- priv-app ---"
          ls product_extracted/priv-app || echo "(empty)"

      - name: Collect APKs
        run: |
          mkdir -p release_apks
          find product_extracted/app      -name "*.apk" -exec cp {} release_apks/ \;
          find product_extracted/priv-app -name "*.apk" -exec cp {} release_apks/ \;
          echo "APKs to upload:"
          ls release_apks/

      - name: Create Release & Upload APKs
        run: |
          gh release create "build-${{ github.run_id }}" \
            release_apks/*.apk \
            --title "🤖 Build ${{ github.run_id }}" \
            --notes "## 📦 crDroid Android 13 — Spes (Redmi Note 11)

          > Extracted from official OTA using [PayloadActions](https://github.com/${{ github.repository }})

          ### 🔗 Source
          | Field | Info |
          |-------|------|
          | 📁 File | [${{ env.OTA_ZIP }}](https://github.com/muralivijay/crdroid_a13_OTA_spes/releases/download/v9.36/${{ env.OTA_ZIP }}) |
          | 🔨 Run | [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | 🔖 Commit | [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |

          ### 📲 Contents
          APKs extracted from \`product.img\` — includes both \`app/\` and \`priv-app/\` directories.

          ---
          <sub>🤖 Auto-generated by GitHub Actions</sub>"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
