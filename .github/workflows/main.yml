name: Extract and Release

on:
    workflow_dispatch:
        inputs:
            ROM_URL:
                description: "ROM_URL"
                default: "https://builds.paranoidandroid.co/aospa-uvite-beta-oneplus9-20240412.zip"
            DEVICE_NAME:
                description: "DEVICE_NAME"
                default: "oneplus9"
            EXTRACTED_FILES:
                description: "EXTRACTED_FILES"
                default: "boot.img, dtbo.img, product.img, system.img, system_ext.img"

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        permissions: write-all
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Download File
              run: curl -LJO ${{ github.event.inputs.ROM_URL }}

            - name: Extract Payload
              run: |
                FILE=$(echo *.zip *.tgz)

                echo "ZIP_FILE=$FILE" >> $GITHUB_ENV
                echo "ZIP_FILE_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)" >> $GITHUB_ENV

                if [[ $FILE == *.tgz ]]; then
                  tar -xzf "$FILE"
                  cp "$(find . -name boot.img | head -1)" .
                  echo "EXTRACTED_FILES=boot.img" >> $GITHUB_ENV
                else
                  chmod +x .github/scripts/android-ota-extractor
                  .github/scripts/android-ota-extractor "$FILE"
                fi

                find . -maxdepth 1 -type f -size +2G -delete

            - name: GH Release
              uses: softprops/action-gh-release@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  files: ${{ github.event.inputs.EXTRACTED_FILES }}
                  name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
                  tag_name: ${{ github.run_id }}
                  body: |
                      Device: ${{ github.event.inputs.DEVICE_NAME }}
                      Filename: [${{ env.ZIP_FILE }}](${{ github.event.inputs.ROM_URL }})
                      Extracted files: ${{ github.event.inputs.EXTRACTED_FILES }}
                      SHA256: ${{ env.ZIP_FILE_SHA256 }}
